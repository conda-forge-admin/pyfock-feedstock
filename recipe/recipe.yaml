schema_version: 1

context:
  version: "0.2.4"

package:
  name: pyfock
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyfock/pyfock-${{ version }}.tar.gz
  sha256: a60c1157e690cd564588805386be1f78793aef3f98e0702a162732f110c44efb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numba >=0.57.0rc1
    - numexpr >=2.7.3
    - joblib >=1.2.0
    - numpy >=1.21.6
    - llvmlite >=0.40.0rc1
    - opt_einsum >=v3.3.0
    - threadpoolctl >=3.1.0
    - numgrid
    - psutil
    - scipy
    - __unix

tests:
  - python:
      imports:
        - pyfock
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: A simplistic and efficient pure-python quantum chemistry library from Phys Whiz.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/manassharma07/pyfock
  repository: https://github.com/manassharma07/pyfock
  documentation: https://pyfock.bragitoff.com/

extra:
  recipe-maintainers:
    - jan-janssen
